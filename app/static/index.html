<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vie Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .site-title {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 22px;
            color: #13164B;
            text-align: center;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            .site-title {
                font-size: 18px;
                margin-bottom: 20px;
            }
        }

        body {
            min-height: 100vh;
            background: #A7AADB;
            font-family: 'Inter', 'Segoe UI', sans-serif;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
            
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 1440px;
        }

        .logo-wrapper {
            width: 100px;
            height: 100px;
            background: #FFFFFF;
            border: 3px solid #797FE0;
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px; 
        }

        .logo-svg {
            width: 61px;
            height: 52px;
        }

        .logo-svg path {
            stroke: #13164B;
            stroke-width: 2px;
        }

        .login-card {
            width: 100%;
            max-width: 400px; 
            background: #FFFFFF;
            border: 5px solid #797FE0;
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 42px 20px 10px 20px;
            box-sizing: border-box;
        }

        .btn {
            box-sizing: border-box;
            width: 100%;
            max-width: 333px;
            height: 60px;
            background: #A7AADB;
            border: 1px solid #13164B;
            border-radius: 30px;
            font-family: 'Inter', sans-serif;
            font-style: normal;
            font-weight: 400;
            font-size: 16px;
            line-height: 19px;
            color: #13164B;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            outline: none;
            transition: background 0.2s ease;
            margin: 0 auto;
        }

        .btn:not(:first-of-type) {
            margin-top: 50px;
        }

        .btn:hover {
            background: #979bc9;
            border-color: #0f1240;
        }

        .btn:active {
            background: #868bc2;
        }

        .footer {
            font-family: 'Inter', sans-serif;
            font-style: normal;
            font-weight: 400;
            font-size: 14px;
            display: flex;
            align-items: right;
            justify-content: right;
            text-align: center;
            color: #071B40;
            margin: 30px 80px 0 0;
            width: 100%;
        }
        
        @media (max-width: 480px) {
            body {
                padding: 20px 15px;
            }
            
            .login-card {
                padding: 30px 15px 25px 15px;
            }
            
            .btn {
                height: 55px;
                font-size: 14px;
            }
            
            .btn:not(:first-of-type) {
                margin-top: 35px;
            }
            
            .footer {
                margin-top: 35px;
                font-size: 14px;
            }
            
            .logo-wrapper {
                width: 80px;
                height: 80px;
                margin-bottom: 20px;
            }
            
            .logo-svg {
                width: 48px;
                height: 42px;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="logo-wrapper">
            <svg class="logo-svg" width="61" height="56" viewBox="0 0 61 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3.15517 1H0M3.15517 1H6.66092M3.15517 1L9.6408 14L16.1264 27L22.6121 40M57.4943 1H61M57.4943 1H53.9885M57.4943 1L50.3951 14L43.296 27L36.1968 40M22.6121 40L29.0977 53L36.1968 40M22.6121 40L22 1M22.6121 40H28M22.6121 40H17M22 1H28M22 1H17M36.1968 40H42M36.1968 40H33V20.5M42 1H33V20.5M33 20.5H42" stroke="#13164B" stroke-width="2"/>
            </svg>
        </div>
        <h1 class="site-title">Обучающая диалоговая система</h1>
        <div class="login-card">
            <button class="btn" onclick="location.href='pages/student_login.html'">Войти как ученик</button>
            <button class="btn" onclick="location.href='pages/teacher_login.html'">Войти как учитель</button>
            <button class="btn" onclick="location.href='pages/admin_login.html'">Войти как администратор</button>
            <div class="footer">Made by Vie</div>
        </div>
    </div>
</body>
</html>
