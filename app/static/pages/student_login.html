<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход ученика</title>
    <link rel="stylesheet" href="student_login.css">
</head>
<body>
    <div class="login-card">
        <h1 class="title">Ученик</h1>
        
        <form id="student-login-form">
            <div class="input-group">
                <div class="input-label">Введите ID</div>
                <input id="student-id" type="text" class="input-field" placeholder="ID">
            </div>
            
            <div class="input-group">
                <div class="input-label">Введите пароль</div>
                <input id="student-password" type="password" class="input-field" placeholder="Пароль">
            </div>
            
            <button type="submit" class="login-btn">Войти</button>
        </form>
    </div>
    
    <div class="footer">
        <p>Made by Vie</p>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const form = document.getElementById("student-login-form");

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const identifier = document.getElementById("student-id").value.trim();
            const password = document.getElementById("student-password").value;

            try {
                const data = await login(identifier, password);

                if (data.user_type !== "student") {
                    alert("Это не ученик");
                    return;
                }

                window.location.href = "../pages/student_dashboard.html";
            } catch (error) {
                alert(error.message);
            }
        });
    </script>
</body>
</html>
