<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Администратор</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/cards.css">
    <link rel="stylesheet" href="../css/components/forms.css">
    <link rel="stylesheet" href="../css/components/navigations.css">
    <link rel="stylesheet" href="../css/components/tables.css">
    <link rel="stylesheet" href="../css/pages/admin_dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="navbar">
            <button class="nav-btn active" data-tab="students">Ученики</button>
            <button class="nav-btn" data-tab="teachers">Учителя</button>
            <button class="logout-nav-btn" type="button" onclick="logout()">Выйти</button>
        </div>

        <!-- Ученики -->
        <div class="section active" id="students-section">
            <h2>Ученики</h2>
            <div class="action-buttons">
                <button class="action-btn" type="button" onclick="openAddStudentModal()">+ Добавить</button>
                <button class="action-btn download-btn" type="button" id="downloadBtn">📥 Скачать последние данные</button>
            </div>
            <div class="list-container" id="studentsList"></div>
        </div>

        <!-- Учителя -->
        <div class="section" id="teachers-section">
            <h2>Учителя</h2>
            <div class="action-buttons">
                <button class="action-btn" type="button" onclick="openAddTeacherModal()">+ Добавить учителя</button>
            </div>
            <div class="list-container" id="teachersList"></div>
        </div>
    </div>

    <!-- Модалка учеников -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <h3>Добавить учеников</h3>
            <input type="text" id="studentClassName" placeholder="Название класса">
            <input type="number" id="studentCount" placeholder="Количество">
            <button type="button" onclick="addStudents()">Подтвердить</button>
            <button type="button" onclick="closeModal('studentModal')">Назад</button>
        </div>
    </div>

    <!-- Модалка учителей -->
    <div id="teacherModal" class="modal">
        <div class="modal-content">
            <h3>Добавить учителя</h3>
            <input type="number" id="teacherCount" placeholder="Количество">
            <button type="button" onclick="addTeacher()">Подтвердить</button>
            <button type="button" onclick="closeModal('teacherModal')">Назад</button>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/admin.js"></script>
    <script>
        let lastGeneratedStudents = [];

        async function renderStudents() {
            try {
                const students = await loadAdminStudents();
                const container = document.getElementById("studentsList");
                container.innerHTML = "";

                if (!students.length) {
                    container.innerHTML = "<p>Учеников пока нет</p>";
                    return;
                }

                students.forEach(student => {
                    const item = document.createElement("div");
                    item.className = "list-item";
                    item.innerHTML = `
                        <span>Ученик ${student.student_number}</span>
                        <button type="button" onclick="removeStudent(${student.id})">Удалить</button>
                    `;
                    container.appendChild(item);
                });
            } catch (error) {
                alert(error.message);
            }
        }

        async function renderTeachers() {
            try {
                const teachers = await loadAdminTeachers();
                const container = document.getElementById("teachersList");
                container.innerHTML = "";

                if (!teachers.length) {
                    container.innerHTML = "<p>Учителей пока нет</p>";
                    return;
                }

                teachers.forEach(teacher => {
                    const item = document.createElement("div");
                    item.className = "list-item";
                    item.innerHTML = `
                        <span>Учитель ${teacher.login}</span>
                        <button type="button" onclick="removeTeacher(${teacher.id})">Удалить</button>
                    `;
                    container.appendChild(item);
                });
            } catch (error) {
                alert(error.message);
            }
        }

        async function renderAll() {
            await renderStudents();
            await renderTeachers();
        }

        async function addStudents() {
            const className = document.getElementById("studentClassName").value.trim();
            const count = Number(document.getElementById("studentCount").value);

            if (!className) {
                alert("Введите название класса");
                return;
            }

            if (!count || count < 1) {
                alert("Введите корректное количество");
                return;
            }

            try {
                const result = await generateAdminStudents(className, count);
                lastGeneratedStudents = result.students || [];

                alert("Ученики успешно созданы");
                closeModal("studentModal");
                document.getElementById("studentClassName").value = "";
                document.getElementById("studentCount").value = "";

                await renderStudents();
            } catch (error) {
                alert(error.message);
            }
        }

        async function addTeacher() {
            const count = Number(document.getElementById("teacherCount").value);

            if (!count || count < 1) {
                alert("Введите корректное количество");
                return;
            }

            try {
                await generateAdminTeachers(count);
                alert("Учителя успешно созданы");

                closeModal("teacherModal");
                document.getElementById("teacherCount").value = "";

                await renderTeachers();
            } catch (error) {
                alert(error.message);
            }
        }

        async function removeStudent(studentId) {
            if (!confirm("Удалить ученика?")) {
                return;
            }

            try {
                await deleteAdminStudent(studentId);
                await renderStudents();
            } catch (error) {
                alert(error.message);
            }
        }

        async function removeTeacher(teacherId) {
            if (!confirm("Удалить учителя?")) {
                return;
            }

            try {
                await deleteAdminTeacher(teacherId);
                await renderTeachers();
            } catch (error) {
                alert(error.message);
            }
        }

        function openModal(id) {
            document.getElementById(id).style.display = "flex";
        }

        function closeModal(id) {
            document.getElementById(id).style.display = "none";
        }

        function openAddStudentModal() {
            openModal("studentModal");
        }

        function openAddTeacherModal() {
            openModal("teacherModal");
        }

        document.getElementById("downloadBtn").onclick = () => {
            if (!lastGeneratedStudents.length) {
                alert("Сначала сгенерируйте учеников");
                return;
            }

            const text = lastGeneratedStudents
                .map((student, index) => `${index + 1}. ID: ${student.student_number} | Пароль: ${student.password}`)
                .join("\n");

            const blob = new Blob([text], { type: "text/plain" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "students_credentials.txt";
            a.click();
        };

        document.querySelectorAll(".nav-btn").forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll(".section").forEach(section => {
                    section.classList.remove("active");
                });

                document.getElementById(btn.dataset.tab + "-section").classList.add("active");

                document.querySelectorAll(".nav-btn").forEach(button => {
                    button.classList.remove("active");
                });

                btn.classList.add("active");
            };
        });

        renderAll();
    </script>
</body>
</html>
