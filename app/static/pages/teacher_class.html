<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Класс учителя</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/cards.css">
    <link rel="stylesheet" href="../css/components/forms.css">
</head>
<body>
    <div class="container">
        <div class="dashboard-container" style="padding: 24px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:12px; flex-wrap:wrap;">
                <h2 id="class-title">Класс</h2>
                <div style="display:flex; gap:12px; flex-wrap:wrap;">
                    <button type="button" onclick="openGenerateModal()">+ Добавить учеников</button>
                    <button type="button" id="downloadBtn">📥 Скачать последние данные</button>
                    <button type="button" onclick="goBack()">Назад</button>
                </div>
            </div>

            <div id="students-list" style="background:white; border-radius:20px; padding:20px;">
                <p>Загрузка...</p>
            </div>

            <div class="footer">
                <p>Made by Vie</p>
            </div>
        </div>
    </div>

    <!-- Модалка генерации -->
    <div id="generateModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Добавить учеников</h3>
            <input type="number" id="studentsCount" placeholder="Количество учеников">
            <button type="button" onclick="generateStudents()">Подтвердить</button>
            <button type="button" onclick="closeModal('generateModal')">Назад</button>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/teacher.js"></script>
    <script>
        let lastGeneratedStudents = [];

        function getSelectedTeacherClassId() {
            return localStorage.getItem("selected_teacher_class_id");
        }

        function goBack() {
            window.location.href = "/static/pages/teacher_dashboard.html";
        }

        function openModal(id) {
            document.getElementById(id).style.display = "flex";
        }

        function closeModal(id) {
            document.getElementById(id).style.display = "none";
        }

        function openGenerateModal() {
            document.getElementById("studentsCount").value = "";
            openModal("generateModal");
        }

        async function renderClassInfo() {
            const classId = getSelectedTeacherClassId();

            if (!classId) {
                alert("Класс не выбран");
                goBack();
                return;
            }

            try {
                const classes = await loadTeacherClasses();
                const currentClass = classes.find(item => String(item.id) === String(classId));

                if (currentClass) {
                    document.getElementById("class-title").textContent = `Класс: ${currentClass.name}`;
                } else {
                    document.getElementById("class-title").textContent = `Класс #${classId}`;
                }
            } catch (error) {
                document.getElementById("class-title").textContent = `Класс #${classId}`;
            }
        }

        async function renderStudents() {
            const classId = getSelectedTeacherClassId();

            if (!classId) {
                alert("Класс не выбран");
                goBack();
                return;
            }

            try {
                const students = await loadTeacherClassStudents(classId);
                const container = document.getElementById("students-list");
                container.innerHTML = "";

                if (!students.length) {
                    container.innerHTML = "<p>В этом классе пока нет учеников</p>";
                    return;
                }

                students.forEach(student => {
                    const row = document.createElement("div");
                    row.style.display = "flex";
                    row.style.justifyContent = "space-between";
                    row.style.alignItems = "center";
                    row.style.gap = "12px";
                    row.style.padding = "12px 0";
                    row.style.borderBottom = "1px solid #e5e7eb";

                    row.innerHTML = `
                        <div>
                            <strong>ID ученика:</strong> ${student.student_number}
                        </div>
                        <button type="button" onclick="removeStudent(${student.id})">Удалить</button>
                    `;

                    container.appendChild(row);
                });
            } catch (error) {
                document.getElementById("students-list").innerHTML = `<p>${error.message}</p>`;
            }
        }

        async function generateStudents() {
            const classId = getSelectedTeacherClassId();
            const count = Number(document.getElementById("studentsCount").value);

            if (!count || count < 1) {
                alert("Введите корректное количество");
                return;
            }

            try {
                const result = await generateTeacherStudents(classId, count);
                lastGeneratedStudents = result.students || [];

                alert("Ученики успешно созданы");
                closeModal("generateModal");
                await renderStudents();
            } catch (error) {
                alert(error.message);
            }
        }

        async function removeStudent(studentId) {
            if (!confirm("Удалить ученика?")) {
                return;
            }

            try {
                await deleteTeacherStudent(studentId);
                await renderStudents();
            } catch (error) {
                alert(error.message);
            }
        }

        document.getElementById("downloadBtn").onclick = () => {
            if (!lastGeneratedStudents.length) {
                alert("Сначала сгенерируйте учеников");
                return;
            }

            const text = lastGeneratedStudents
                .map((student, index) => `${index + 1}. ID: ${student.student_number} | Пароль: ${student.password}`)
                .join("\n");

            const blob = new Blob([text], { type: "text/plain" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "teacher_students_credentials.txt";
            a.click();
        };

        async function initPage() {
            await renderClassInfo();
            await renderStudents();
        }

        initPage();
    </script>
</body>
</html>
