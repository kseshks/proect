<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диалог с ИИ</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/cards.css">
</head>
<body>
    <div class="container">
        <div class="dashboard-container" style="padding: 24px;">
            <h2 id="topic-title">Тема</h2>

            <div style="display:grid; grid-template-columns: 300px 1fr; gap: 20px; margin-top: 20px;">
                <div style="background:white; border-radius:20px; padding:20px;">
                    <h3>Доступные вопросы</h3>
                    <div id="questions-list"></div>
                </div>

                <div style="background:white; border-radius:20px; padding:20px;">
                    <h3>Диалог</h3>
                    <div id="chat-messages" style="max-height:500px; overflow:auto;"></div>
                </div>
            </div>

            <div style="margin-top: 20px;">
                <button type="button" onclick="window.location.href='/static/pages/student_dashboard.html'">Назад</button>
            </div>

            <div class="footer">
                <p>Made by Vie</p>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/student.js"></script>
    <script>
        async function renderTopic() {
            const topicId = getSelectedTopic();

            if (!topicId) {
                alert("Тема не выбрана");
                window.location.href = "/static/pages/student_dashboard.html";
                return;
            }

            try {
                const topic = await loadStudentTopic(topicId);
                document.getElementById("topic-title").textContent = topic.title;

                const questionsContainer = document.getElementById("questions-list");
                questionsContainer.innerHTML = "";

                topic.questions.forEach(question => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.textContent = question.text;
                    btn.style.display = "block";
                    btn.style.marginBottom = "10px";
                    btn.onclick = async function () {
                        await sendQuestion(topicId, question.id);
                    };
                    questionsContainer.appendChild(btn);
                });
            } catch (error) {
                alert(error.message);
            }
        }

        async function renderDialog() {
            const topicId = getSelectedTopic();

            try {
                const messages = await loadStudentDialog(topicId);
                const container = document.getElementById("chat-messages");
                container.innerHTML = "";

                if (!messages.length) {
                    container.innerHTML = "<p>История пуста</p>";
                    return;
                }

                messages.forEach(message => {
                    const item = document.createElement("div");
                    item.style.marginBottom = "16px";
                    item.innerHTML = `
                        <div style="margin-bottom:8px;">
                            <strong>Вопрос:</strong> ${message.question_text}
                        </div>
                        <div>
                            <strong>Ответ:</strong> ${message.answer_text}
                        </div>
                    `;
                    container.appendChild(item);
                });

                container.scrollTop = container.scrollHeight;
            } catch (error) {
                alert(error.message);
            }
        }

        async function sendQuestion(topicId, questionId) {
            try {
                await askStudentQuestion(topicId, questionId);
                await renderDialog();
            } catch (error) {
                alert(error.message);
            }
        }

        renderTopic();
        renderDialog();
    </script>
</body>
</html>
