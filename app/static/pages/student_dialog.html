<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диалог c ИИ</title>
    <link rel="stylesheet" href="student_dialog.css">
</head>
<body>
    <div class="dialog-layout">
        <!-- Заголовок -->
        <div class="dialog-header">
            <h1 class="dialog-title" id="topic-title">Тема</h1>
            <p class="dialog-subtitle">Обучающая диалоговая система</p>
        </div>

        <!-- Основной контент -->
        <div class="dialog-main">
            <!-- Левая колонка: вопросы -->
            <div class="questions-panel">
                <div class="panel-header">
                    <h2>Доступные вопросы</h2>
                </div>
                <div class="questions-list" id="questions-list">
                    <p class="empty-state">Загрузка вопросов...</p>
                </div>
            </div>

            <!-- Правая колонка: диалог -->
            <div class="chat-panel">
                <div class="panel-header">
                    <h2>Диалог</h2>
                </div>
                
                <!-- История сообщений -->
                <div class="chat-messages" id="chat-messages">
                    <p class="empty-state">Выберите вопрос из списка слева</p>
                </div>
            </div>
        </div>

        <!-- Кнопка назад -->
        <div class="dialog-footer">
            <button class="back-btn" onclick="goBack()">← Назад к темам</button>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Made by Vie</p>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/student.js"></script>
    <script>
        let currentTopicId = null;

        // ==================== НАВИГАЦИЯ ====================
        function goBack() {
            window.location.href = "student_dashboard.html";
        }

        // ==================== ЗАГРУЗКА ТЕМЫ ====================
        async function renderTopic() {
            currentTopicId = getSelectedTopic();

            if (!currentTopicId) {
                alert("Тема не выбрана");
                goBack();
                return;
            }

            console.log("Загрузка темы:", currentTopicId);

            try {
                const topic = await loadStudentTopic(currentTopicId);
                console.log("Тема загружена:", topic);
                
                document.getElementById("topic-title").textContent = topic.title;

                const questionsContainer = document.getElementById("questions-list");
                questionsContainer.innerHTML = "";

                if (!topic.questions || topic.questions.length === 0) {
                    questionsContainer.innerHTML = '<p class="empty-state">Нет доступных вопросов</p>';
                    return;
                }

                topic.questions.forEach(question => {
                    const btn = document.createElement("button");
                    btn.className = "question-btn";
                    btn.textContent = question.text;
                    btn.onclick = () => sendQuestion(question.id);
                    questionsContainer.appendChild(btn);
                });
            } catch (error) {
                console.error("Ошибка загрузки темы:", error);
                document.getElementById("questions-list").innerHTML = 
                    `<p class="empty-state">Ошибка: ${error.message}</p>`;
            }
        }

        // ==================== ЗАГРУЗКА ДИАЛОГА ====================
        async function renderDialog() {
            if (!currentTopicId) return;

            try {
                const messages = await loadStudentDialog(currentTopicId);
                const container = document.getElementById("chat-messages");
                container.innerHTML = "";

                if (!messages || messages.length === 0) {
                    container.innerHTML = '<p class="empty-state">Выберите вопрос из списка слева</p>';
                    return;
                }

                messages.forEach(message => {
                    const messageDiv = document.createElement("div");
                    messageDiv.className = "chat-message";
                    
                    // Вопрос
                    const questionDiv = document.createElement("div");
                    questionDiv.className = "message-question";
                    questionDiv.innerHTML = `
                        <span class="message-label">❓ Вопрос:</span>
                        <span class="message-text">${message.question_text}</span>
                    `;
                    
                    // Ответ
                    const answerDiv = document.createElement("div");
                    answerDiv.className = "message-answer";
                    
                    if (message.answer_text) {
                        answerDiv.innerHTML = `
                            <span class="message-label">🤖 Ответ:</span>
                            <span class="message-text">${message.answer_text}</span>
                        `;
                    } else {
                        answerDiv.innerHTML = `
                            <span class="message-label">🤖 Ответ:</span>
                            <span class="message-text" style="opacity:0.6;">Ожидание ответа...</span>
                        `;
                    }
                    
                    messageDiv.appendChild(questionDiv);
                    messageDiv.appendChild(answerDiv);
                    container.appendChild(messageDiv);
                });

                container.scrollTop = container.scrollHeight;
            } catch (error) {
                console.error("Ошибка загрузки диалога:", error);
                document.getElementById("chat-messages").innerHTML = 
                    `<p class="empty-state">Ошибка загрузки диалога: ${error.message}</p>`;
            }
        }

        // ==================== ОТПРАВКА ВОПРОСА ====================
        async function sendQuestion(questionId) {
            if (!currentTopicId) {
                alert("Тема не выбрана");
                return;
            }

            console.log("Отправка вопроса:", { topicId: currentTopicId, questionId });

            try {
                // Показываем, что вопрос отправляется
                const container = document.getElementById("chat-messages");
                const loadingDiv = document.createElement("div");
                loadingDiv.className = "chat-message";
                loadingDiv.innerHTML = `
                    <div class="message-question">
                        <span class="message-label">❓ Вопрос отправлен...</span>
                    </div>
                    <div class="message-answer">
                        <span class="message-text" style="opacity:0.6;">Нейрорепетитор думает...</span>
                    </div>
                `;
                container.appendChild(loadingDiv);
                container.scrollTop = container.scrollHeight;

                const result = await askStudentQuestion(currentTopicId, questionId);
                console.log("Ответ получен:", result);
                
                // Перезагружаем диалог
                await renderDialog();
            } catch (error) {
                console.error("Ошибка отправки вопроса:", error);
                alert("Не удалось отправить вопрос. Проверьте подключение к серверу.");
            }
        }

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        async function initPage() {
            console.log("Инициализация страницы диалога");
            await renderTopic();
            await renderDialog();
        }

        initPage();
    </script>
</body>
</html>
