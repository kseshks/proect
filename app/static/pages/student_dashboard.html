<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Темы ученика</title>
    <link rel="stylesheet" href="student_dashboard.css">
</head>
<body>
    <div class="themes-container">
        <div class="themes-wrapper" id="topics-list">
            <!-- Темы будут загружены через JavaScript -->
        </div>
    </div>

    <button class="start-btn" id="start-topic-btn">Начать</button>

    <div class="footer">
        <p>Made by Vie</p>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/student.js"></script>
    <script>
        let selectedTopicId = null;

        async function renderTopics() {
            try {
                const topics = await loadStudentTopics();
                const container = document.getElementById("topics-list");
                container.innerHTML = "";

                if (!topics.length) {
                    container.innerHTML = '<div class="empty-state">Нет доступных тем</div>';
                    return;
                }

                topics.forEach(topic => {
                    const card = document.createElement("div");
                    card.className = "theme-card";
                    card.innerHTML = `
                        <span class="theme-title">${topic.title}</span>
                        <button class="select-btn" data-topic-id="${topic.id}" onclick="selectTopic(${topic.id}, this)">Выбрать</button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                document.getElementById("topics-list").innerHTML = 
                    `<div class="empty-state">Ошибка загрузки: ${error.message}</div>`;
            }
        }

        function selectTopic(topicId, btn) {
            document.querySelectorAll('.select-btn').forEach(b => {
                b.classList.remove('selected');
            });
            
            // Добавляем класс selected текущей кнопке
            btn.classList.add('selected');
            selectedTopicId = topicId;
            setSelectedTopic(topicId);
        }

        document.getElementById("start-topic-btn").addEventListener("click", function () {
            const topicId = getSelectedTopic();

            if (!topicId) {
                alert("Сначала выберите тему");
                return;
            }

            window.location.href = "student_dialog.html";
        });

        renderTopics();
    </script>
</body>
</html>
