<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Темы ученика</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/cards.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h2>Выбор темы</h2>

            <div id="topics-list"></div>

            <div style="margin-top: 20px;">
                <button id="start-topic-btn" type="button">Начать</button>
            </div>

            <div class="footer">
                <p>Made by Vie</p>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/student.js"></script>
    <script>
        async function renderTopics() {
            try {
                const topics = await loadStudentTopics();
                const container = document.getElementById("topics-list");
                container.innerHTML = "";

                if (!topics.length) {
                    container.innerHTML = "<p>Тем пока нет</p>";
                    return;
                }

                topics.forEach(topic => {
                    const item = document.createElement("div");
                    item.style.marginBottom = "12px";

                    item.innerHTML = `
                        <div class="topic-card" style="display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px; background:white; border-radius:16px;">
                            <div>
                                <strong>${topic.title}</strong>
                            </div>
                            <button type="button" onclick="selectTopic(${topic.id})">Выбрать</button>
                        </div>
                    `;

                    container.appendChild(item);
                });
            } catch (error) {
                alert(error.message);
            }
        }

        function selectTopic(topicId) {
            setSelectedTopic(topicId);
            alert("Тема выбрана");
        }

        document.getElementById("start-topic-btn").addEventListener("click", function () {
            const topicId = getSelectedTopic();

            if (!topicId) {
                alert("Сначала выберите тему");
                return;
            }

            window.location.href = "/static/pages/student_dialog.html";
        });

        renderTopics();
    </script>
</body>
</html>
