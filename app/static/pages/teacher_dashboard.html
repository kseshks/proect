<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учитель - Панель управления</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/navigation.css">
    <link rel="stylesheet" href="../css/components/buttons.css">
    <link rel="stylesheet" href="../css/components/cards.css">
    <link rel="stylesheet" href="../css/pages/teacher_dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <nav class="navbar">
            <div class="nav-buttons">
                <button class="nav-btn active" id="ratingBtn" type="button" onclick="showSection('rating')">Рейтинг</button>
                <button class="nav-btn" id="themesBtn" type="button" onclick="showSection('themes')">Темы</button>
                <button class="nav-btn" id="classesBtn" type="button" onclick="showSection('classes')">Классы</button>
            </div>
            <button class="logout-btn" type="button" onclick="logout()">Выйти</button>
        </nav>

        <!-- Рейтинг -->
        <div id="ratingSection" class="section active">
            <div class="themes-header">
                <h2>Рейтинг учеников</h2>
            </div>
            <div id="ratingList" class="list-container">
                <p>Загрузка...</p>
            </div>
        </div>

        <!-- Темы -->
        <div id="themesSection" class="section">
            <div class="themes-header">
                <h2>Темы</h2>
                <button class="add-theme-btn" type="button" onclick="openThemeModal()">+ Создать тему</button>
            </div>
            <div class="themes-grid" id="themesGrid"></div>
        </div>

        <!-- Классы -->
        <div id="classesSection" class="section">
            <div class="themes-header">
                <h2>Классы</h2>
                <button class="add-theme-btn" type="button" onclick="openClassModal()">+ Добавить класс</button>
            </div>
            <div class="themes-grid" id="classesGrid"></div>
        </div>

        <div class="footer">
            <p>Made by Vie</p>
        </div>
    </div>

    <!-- Модалка темы -->
    <div id="themeModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Создать тему</h3>
            <input type="text" id="themeTitle" placeholder="Название темы">
            <textarea id="themeDescription" placeholder="Описание темы"></textarea>
            <button type="button" onclick="createTheme()">Подтвердить</button>
            <button type="button" onclick="closeModal('themeModal')">Назад</button>
        </div>
    </div>

    <!-- Модалка класса -->
    <div id="classModal" class="modal" style="display:none;">
        <div class="modal-content">
            <h3>Добавить класс</h3>
            <input type="text" id="className" placeholder="Название класса">
            <button type="button" onclick="createClass()">Подтвердить</button>
            <button type="button" onclick="closeModal('classModal')">Назад</button>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/teacher.js"></script>
    <script>
        function showSection(section) {
            document.querySelectorAll(".section").forEach(el => el.classList.remove("active"));
            document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));

            if (section === "rating") {
                document.getElementById("ratingSection").classList.add("active");
                document.getElementById("ratingBtn").classList.add("active");
            }

            if (section === "themes") {
                document.getElementById("themesSection").classList.add("active");
                document.getElementById("themesBtn").classList.add("active");
            }

            if (section === "classes") {
                document.getElementById("classesSection").classList.add("active");
                document.getElementById("classesBtn").classList.add("active");
            }
        }

        function openModal(id) {
            document.getElementById(id).style.display = "flex";
        }

        function closeModal(id) {
            document.getElementById(id).style.display = "none";
        }

        function openThemeModal() {
            document.getElementById("themeTitle").value = "";
            document.getElementById("themeDescription").value = "";
            openModal("themeModal");
        }

        function openClassModal() {
            document.getElementById("className").value = "";
            openModal("classModal");
        }

        async function renderRatings() {
            try {
                const data = await loadTeacherRatings();
                const container = document.getElementById("ratingList");
                container.innerHTML = "";

                if (!data.items || !data.items.length) {
                    container.innerHTML = "<p>Рейтинг пока пуст</p>";
                    return;
                }

                data.items.forEach(item => {
                    const row = document.createElement("div");
                    row.className = "list-item";
                    row.textContent = `Ученик ${item.student_number}`;
                    container.appendChild(row);
                });
            } catch (error) {
                document.getElementById("ratingList").innerHTML = `<p>${error.message}</p>`;
            }
        }

        async function renderTopics() {
            try {
                const topics = await loadTeacherTopics();
                const grid = document.getElementById("themesGrid");
                grid.innerHTML = "";

                if (!topics.length) {
                    grid.innerHTML = "<p>Тем пока нет</p>";
                    return;
                }

                topics.forEach(topic => {
                    const card = document.createElement("div");
                    card.className = "theme-card";
                    card.innerHTML = `
                        <span class="theme-name">${topic.title}</span>
                        <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
                            <button type="button" onclick="openTopic(${topic.id})">Открыть</button>
                            <button type="button" onclick="removeTopic(${topic.id})">Удалить</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                document.getElementById("themesGrid").innerHTML = `<p>${error.message}</p>`;
            }
        }

        async function renderClasses() {
            try {
                const classes = await loadTeacherClasses();
                const grid = document.getElementById("classesGrid");
                grid.innerHTML = "";

                if (!classes.length) {
                    grid.innerHTML = "<p>Классов пока нет</p>";
                    return;
                }

                classes.forEach(item => {
                    const card = document.createElement("div");
                    card.className = "theme-card";
                    card.innerHTML = `
                        <span class="theme-name">${item.name}</span>
                        <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
                            <button type="button" onclick="openClassPage(${item.id})">Открыть</button>
                            <button type="button" onclick="removeClass(${item.id})">Удалить</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                document.getElementById("classesGrid").innerHTML = `<p>${error.message}</p>`;
            }
        }

        async function createTheme() {
            const title = document.getElementById("themeTitle").value.trim();
            const description = document.getElementById("themeDescription").value.trim();

            if (!title) {
                alert("Введите название темы");
                return;
            }

            try {
                await createTeacherTopic(title, description || null);
                closeModal("themeModal");
                await renderTopics();
            } catch (error) {
                alert(error.message);
            }
        }

        async function removeTopic(topicId) {
            if (!confirm("Удалить тему?")) {
                return;
            }

            try {
                await deleteTeacherTopic(topicId);
                await renderTopics();
            } catch (error) {
                alert(error.message);
            }
        }

        async function createClass() {
            const name = document.getElementById("className").value.trim();

            if (!name) {
                alert("Введите название класса");
                return;
            }

            try {
                await createTeacherClass(name);
                closeModal("classModal");
                await renderClasses();
            } catch (error) {
                alert(error.message);
            }
        }

        async function removeClass(classId) {
            if (!confirm("Удалить класс?")) {
                return;
            }

            try {
                await deleteTeacherClass(classId);
                await renderClasses();
            } catch (error) {
                alert(error.message);
            }
        }

        function openTopic(topicId) {
            localStorage.setItem("selected_teacher_topic_id", String(topicId));
            window.location.href = "/static/pages/teacher_topic.html";
        }

        function openClassPage(classId) {
            localStorage.setItem("selected_teacher_class_id", String(classId));
            window.location.href = "/static/pages/teacher_class.html";
        }

        async function initPage() {
            await renderRatings();
            await renderTopics();
            await renderClasses();
        }

        initPage();
    </script>
</body>
</html>
